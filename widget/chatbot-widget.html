{# Hotel ChatBot Widget — include just before </body> in base.html: {% include "chatbot-widget.html" %} #}
{# Configure API_URL + API_KEY in the script block below. #}

{% if request.user.is_authenticated %}
<script>
  window.HB_USER = {
    email: "{{ request.user.email|default:''|escapejs }}",
    name:  "{{ request.user.get_full_name|default:request.user.username|escapejs }}"
  };
</script>
{% endif %}

<style>
  #hb-chat-toggle {
    position: fixed; right: 22px; bottom: 22px; z-index: 9999;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #7c5cff, #5b3df5); color: #fff;
    font-size: 26px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  #hb-chat-toggle:hover { transform: scale(1.05); }

  #hb-chat-panel {
    position: fixed; right: 22px; bottom: 90px; z-index: 9999;
    width: 380px; max-width: calc(100vw - 32px); height: 560px; max-height: calc(100vh - 120px);
    background: #ffffff; color: #111; border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,.28); display: none; flex-direction: column;
    overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #hb-chat-panel.open { display: flex; }

  #hb-chat-header {
    background: linear-gradient(135deg, #7c5cff, #5b3df5); color: #fff;
    padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  #hb-chat-header small { display: block; font-weight: 400; opacity: .85; font-size: 12px; }
  #hb-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: .9; }

  #hb-chat-meta {
    padding: 8px 12px; background: #f6f5ff; border-bottom: 1px solid #eee;
    font-size: 12px; color: #555;
  }
  #hb-chat-meta input {
    border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; font-size: 12px; width: 100%;
  }
  #hb-signed-in { display: none; align-items: center; gap: 6px; }
  #hb-signed-in .hb-dot { width: 8px; height: 8px; background: #1bb56b; border-radius: 50%; }
  #hb-ref-toggle {
    background: none; border: none; color: #5b3df5; cursor: pointer; padding: 0;
    font-size: 12px; text-decoration: underline; margin-left: 8px;
  }
  #hb-ref-row { display: none; margin-top: 6px; }
  #hb-anon-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  #hb-chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .hb-msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
  .hb-msg.user { align-self: flex-end; background: #7c5cff; color: #fff; border-bottom-right-radius: 4px; }
  .hb-msg.bot { align-self: flex-start; background: #f1f1f4; color: #111; border-bottom-left-radius: 4px; white-space: pre-wrap; }
  .hb-msg.bot.handoff { background: #fff4e5; border: 1px solid #ffd49a; }
  .hb-msg.bot a { color: #5b3df5; font-weight: 600; text-decoration: underline; }
  .hb-msg.bot strong { color: #111; }
  .hb-sources { font-size: 12px; color: #555; margin-top: 6px; }
  .hb-sources details { margin-top: 4px; }
  .hb-sources summary { cursor: pointer; color: #5b3df5; }
  .hb-typing { font-style: italic; opacity: .6; font-size: 12px; }

  #hb-chat-input { display: flex; border-top: 1px solid #eee; padding: 10px; gap: 8px; background: #fafafa; }
  #hb-chat-input textarea {
    flex: 1; resize: none; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: inherit; height: 38px; max-height: 100px;
  }
  #hb-chat-input button {
    background: #7c5cff; color: #fff; border: none; border-radius: 8px;
    padding: 0 16px; font-weight: 600; cursor: pointer;
  }
  #hb-chat-input button:disabled { opacity: .5; cursor: not-allowed; }
</style>

<button id="hb-chat-toggle" aria-label="Open chat">💬</button>

<div id="hb-chat-panel" role="dialog" aria-label="Hotel support chat">
  <div id="hb-chat-header">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:36px;height:36px;border-radius:50%;background:#fff;color:#5b3df5;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px">K</div>
      <div>
        Kelly · Hotel Concierge
        <small>Bookings, policies, recommendations</small>
      </div>
    </div>
    <button id="hb-close" aria-label="Close">×</button>
  </div>

  <div id="hb-chat-meta">
    <div id="hb-signed-in">
      <span class="hb-dot"></span>
      <span>Signed in as <strong id="hb-user-name"></strong></span>
      <button id="hb-ref-toggle" type="button">+ Add booking reference</button>
    </div>
    <div id="hb-ref-row">
      <input id="hb-ref" placeholder="Booking reference (e.g. HTL-1001)" autocomplete="off">
    </div>
    <div id="hb-anon-row">
      <input id="hb-ref-anon" placeholder="Booking ref (optional)" autocomplete="off">
      <input id="hb-email-anon" placeholder="Email (optional)" autocomplete="email">
    </div>
  </div>

  <div id="hb-chat-messages"></div>

  <div id="hb-chat-input">
    <textarea id="hb-question" placeholder="Type your question…" rows="1"></textarea>
    <button id="hb-send">Send</button>
  </div>
</div>

<script>
(function () {
  // ▼▼▼ CONFIGURE THESE TWO ▼▼▼
  const API_URL = "https://hotelchatapi.onrender.com/api/chat";
  const API_KEY = "6b74f5288ee8707b517d6e6f8448883e61d58f4c54f6badd7f009a3acef349eaff8995613ddb6f11eebc91fde20a5a80";
  // ▲▲▲

  const $ = (id) => document.getElementById(id);
  const panel = $("hb-chat-panel");
  const toggle = $("hb-chat-toggle");
  const closeBtn = $("hb-close");
  const messages = $("hb-chat-messages");
  const question = $("hb-question");
  const send = $("hb-send");

  const signedInRow = $("hb-signed-in");
  const userNameEl = $("hb-user-name");
  const refToggle = $("hb-ref-toggle");
  const refRow = $("hb-ref-row");
  const refField = $("hb-ref");
  const anonRow = $("hb-anon-row");
  const refFieldAnon = $("hb-ref-anon");
  const emailFieldAnon = $("hb-email-anon");

  const user = window.HB_USER || null;
  const isAuthed = !!(user && user.email);

  if (isAuthed) {
    signedInRow.style.display = "flex";
    userNameEl.textContent = user.name || user.email;
    anonRow.style.display = "none";
    refToggle.addEventListener("click", () => {
      const open = refRow.style.display === "block";
      refRow.style.display = open ? "none" : "block";
      refToggle.textContent = open ? "+ Add booking reference" : "− Hide booking reference";
      if (!open) refField.focus();
    });
  }

  function currentBookingInfo() {
    if (isAuthed) {
      return { ref: refField.value.trim() || null, email: user.email };
    }
    return {
      ref: refFieldAnon.value.trim() || null,
      email: emailFieldAnon.value.trim() || null,
    };
  }

  const sessionId = (() => {
    let s = localStorage.getItem("hb_session");
    if (!s) {
      s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2, 14));
      localStorage.setItem("hb_session", s);
    }
    return s;
  })();

  const history = [];   // [{role, content}, …] — last N turns sent to API for context
  const MAX_HISTORY = 12;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])
    );
  }

  function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/(^|[^"=])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\n/g, "<br>");
    return html;
  }

  function addBubble(text, who, sources = [], handoff = false) {
    const div = document.createElement("div");
    div.className = "hb-msg " + who + (handoff ? " handoff" : "");
    if (who === "bot") {
      div.innerHTML = renderMarkdown(text);
    } else {
      div.textContent = text;
    }
    if (sources && sources.length) {
      const wrap = document.createElement("div");
      wrap.className = "hb-sources";
      wrap.innerHTML = "📎 Sources:";
      sources.forEach((s) => {
        const d = document.createElement("details");
        d.innerHTML =
          "<summary>[" + s.index + "] " + escapeHtml(s.title) + " (" + s.score + ")</summary>" +
          "<div style='padding:6px 0;white-space:pre-wrap'>" + escapeHtml(s.content) + "</div>";
        wrap.appendChild(d);
      });
      div.appendChild(wrap);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function setTyping(on) {
    let el = $("hb-typing");
    if (on && !el) {
      el = document.createElement("div");
      el.id = "hb-typing";
      el.className = "hb-msg bot hb-typing";
      el.textContent = "typing…";
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    } else if (!on && el) {
      el.remove();
    }
  }

  const BOOKING_INTENT = /\b(my booking|booking|reserv|reservation|refund|check[- ]?in|check[- ]?out|cancel|payment|invoice|receipt|stay|room)\b/i;

  function pushHistory(role, content) {
    history.push({ role, content });
    if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
  }

  async function ask(text) {
    addBubble(text, "user");
    pushHistory("user", text);
    question.value = "";
    send.disabled = true;
    setTyping(true);

    const info = currentBookingInfo();

    // For logged-in users: nudge them to add booking ref the first time they ask
    // a booking-related question without one.
    if (isAuthed && !info.ref && BOOKING_INTENT.test(text) && !sessionStorage.getItem("hb_refprompted")) {
      sessionStorage.setItem("hb_refprompted", "1");
      refRow.style.display = "block";
      refToggle.textContent = "− Hide booking reference";
      refField.focus();
    }

    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify({
          question: text,
          booking_ref: info.ref,
          booking_email: info.email,
          session_id: sessionId,
          history: history.slice(0, -1),  // omit the current turn
        }),
      });
      setTyping(false);
      if (!r.ok) {
        addBubble("Sorry, I couldn't reach support right now. (" + r.status + ")", "bot", [], true);
        return;
      }
      const data = await r.json();
      addBubble(data.answer, "bot", data.sources || [], !!data.handoff);
      pushHistory("assistant", data.answer);
    } catch (e) {
      setTyping(false);
      addBubble("Network error. Please try again.", "bot", [], true);
    } finally {
      send.disabled = false;
      question.focus();
    }
  }

  toggle.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open") && messages.children.length === 0) {
      const firstName = isAuthed && user.name ? user.name.split(" ")[0] : null;
      const greeting = firstName
        ? `Hi ${firstName}! I'm **Kelly**, your hotel concierge. Ask me about bookings, cancellations, payments, or which hotel suits you best. How can I help today?`
        : "Hi! I'm **Kelly**, your hotel concierge. Ask me about bookings, cancellations, payments, or which hotel suits you best. How can I help today?";
      addBubble(greeting, "bot");
      pushHistory("assistant", greeting);
    }
    if (panel.classList.contains("open")) question.focus();
  });
  closeBtn.addEventListener("click", () => panel.classList.remove("open"));
  send.addEventListener("click", () => {
    const t = question.value.trim();
    if (t) ask(t);
  });
  question.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send.click(); }
  });
})();
</script>
